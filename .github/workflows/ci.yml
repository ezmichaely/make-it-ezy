name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: type-aware ESLint resolves workspace packages via dist/*.d.ts
      - name: Build
        run: pnpm build

      - name: Packaged artifact smoke test
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          smoke_prefix="$(mktemp -d)"
          work_dir="$(mktemp -d)"
          cleanup() { rm -rf "$pack_dir" "$smoke_prefix" "$work_dir"; }
          trap cleanup EXIT

          pnpm --filter ./apps/cli pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'make-it-ezy-*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "No make-it-ezy tarball produced" >&2
            exit 1
          fi

          npm install -g --prefix "$smoke_prefix" "$tarball"
          export PATH="$smoke_prefix/bin:$PATH"

          cd "$work_dir"
          ezy --help
          ezy plan x --local-only

      - name: ESLint (strict)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  windows-install-spawn:
    name: windows install spawn smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify npx spawn on Windows
        shell: bash
        run: |
          node --input-type=module -e "import { spawnSync } from 'node:child_process'; const r = spawnSync('npx', ['--version'], { shell: process.platform === 'win32', encoding: 'utf8' }); if (r.error || r.status !== 0) { console.error(r.error ?? r.stderr ?? r.stdout); process.exit(1); } console.log('npx', r.stdout.trim())"
